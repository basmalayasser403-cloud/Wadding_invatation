<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed & Asmaa — Wedding Invitation</title>
    
    <!-- Open Graph Preview for WhatsApp & Social Media -->
    <meta property="og:title" content="Mohammed & Asmaa — Our Wedding">
    <meta property="og:description" content="Join us to celebrate the wedding of Mohammed & Asmaa on 16 November 2026.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1000">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0d0f12;
            background-image: 
                radial-gradient(at 50% 0%, rgba(255, 255, 255, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.03) 0px, transparent 50%);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 45px 25px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .subtitle-top {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .title-names {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .event-type {
            font-size: 1rem;
            font-weight: 300;
            color: #cbd5e1;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .divider {
            width: 50px;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 auto 25px auto;
        }

        .wedding-details {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #e2e8f0;
            margin-bottom: 20px;
        }

        .venue-info {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 30px;
        }

        .venue-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }

        .location-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }

        .location-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .countdown-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #64748b;
            margin-bottom: 15px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .time-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px;
            min-width: 68px;
        }

        .time-box .number {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f8fafc;
            display: block;
            font-family: 'Montserrat', sans-serif;
        }

        .time-box .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
        }

        .arabic-blessing {
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            color: #94a3b8;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="subtitle-top">Save The Date</div>
        <h1 class="title-names">Mohammed & Asmaa</h1>
        <div class="event-type">— Our Wedding —</div>

        <div class="divider"></div>

        <div class="wedding-details">
            Join us to celebrate our wedding on<br>
            <strong>Monday, 16 November 2026</strong><br>
            at 8:00 PM
        </div>

        <!-- تفاصيل اسم القاعة ورابط الخريطة -->
        <div class="venue-info">
            <div class="venue-name">📍 Reval Hall — Engineers Club, Old Damietta</div>
            <a href="https://maps.app.goo.gl/QpgB1WqAV7m2eZtq6" target="_blank" class="location-link">
                View Location on Google Maps &rarr;
            </a>
        </div>

        <div class="countdown-title">Counting Down</div>
        <div class="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Mins</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Secs</span>
            </div>
        </div>

        <div class="arabic-blessing">يسعدنا حضوركم لتشاركونا فرحتنا ✨</div>
    </div>

    <script>
        // Target Date: 16 Nov 2026 at 20:00 (8:00 PM)
        const weddingDate = new Date(2026, 10, 16, 20, 0, 0).getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown").innerHTML = "<div style='font-size:1.1rem; color:#38bdf8;'>We Are Married! 🎉</div>";
            }
        }, 1000);
    </script>

</body>
</html>
